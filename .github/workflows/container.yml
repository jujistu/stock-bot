name: Stockbot Container Security

on:
    pull_request:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    container:
        name: Build and Scan Container
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

            - name: Build image
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  push: false
                  load: true
                  tags: go-stockbot:${{ github.sha }}

            - name: Verify container security
              run: |
                  USER="$(docker image inspect go-stockbot:${{ github.sha }} --format '{{.Config.User}}')"
                  ENTRYPOINT="$(docker image inspect go-stockbot:${{ github.sha }} --format '{{json .Config.Entrypoint}}')"

                  echo "User: $USER"
                  echo "Entrypoint: $ENTRYPOINT"

                  test "$USER" = "appuser"
                  test "$ENTRYPOINT" = '["/app/gostockbot"]'

            - name: Trivy image scan
              uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
              with:
                  image-ref: go-stockbot:${{ github.sha }}
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: "1"
                  pkg-types: os,library

            - name: Generate SBOM
              uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
              with:
                  image: go-stockbot:${{ github.sha }}
                  format: spdx-json
                  output-file: sbom.spdx.json

            - name: Upload SBOM
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: stockbot-sbom-${{ github.sha }}
                  path: sbom.spdx.json
                  if-no-files-found: error
